name: Refresh terminal.svg

on:
  schedule:
    # daily 00:30 UTC (~6:00 AM IST)
    - cron: "30 0 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/gen_terminal.py"
      - ".github/workflows/refresh-terminal.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate assets/terminal.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_terminal.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.svg
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: refresh terminal.svg stats"
          git push
